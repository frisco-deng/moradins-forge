name: Tooling / Dependency Submission

on:
  workflow_dispatch:
    inputs:
      require_submission:
        description: Require successful submission for this exact candidate
        required: false
        default: true
        type: boolean
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  submit-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        # v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Submit dependency graph
        id: submit
        if: ${{ github.event.repository.private == false || vars.TPL_ENABLE_DEPENDENCY_SUBMISSION == 'true' || vars.META_RAG_ENABLE_DEPENDENCY_SUBMISSION == 'true' || vars.TPL_REQUIRE_DEPENDENCY_SUBMISSION == 'true' || (github.event_name == 'workflow_dispatch' && inputs.require_submission) }}
        # v0.0.7
        uses: advanced-security/component-detection-dependency-submission-action@64db6d9d15fd76171b996ad40766f64ae4abae9a
        continue-on-error: true
        with:
          detectors: UvLock=EnableIfDefaultOff
      - name: Summarize dependency submission result
        if: always()
        shell: bash
        env:
          SUBMISSION_REQUIRED: ${{ vars.TPL_REQUIRE_DEPENDENCY_SUBMISSION == 'true' || (github.event_name == 'workflow_dispatch' && inputs.require_submission) }}
          SUBMIT_OUTCOME: ${{ steps.submit.outcome }}
        run: |
          set -euo pipefail
          if [ "${SUBMIT_OUTCOME}" = "success" ]; then
            echo "[tooling] dependency submission completed"
          else
            if [ "${SUBMISSION_REQUIRED}" = "true" ]; then
              echo "::error::Required dependency submission did not complete."
              echo "[tooling] dependency_submission=unavailable_or_failed"
              exit 1
            fi
            echo "::warning::Optional dependency submission did not complete."
            echo "[tooling] enable the repository Dependency Graph when snapshots should be enforced"
            echo "[tooling] dependency_submission=soft-skip"
          fi
