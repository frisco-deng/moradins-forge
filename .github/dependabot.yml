version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      uv-minor-patch:
        applies-to: version-updates
        exclude-patterns:
          - "ruff"
        update-types:
          - "minor"
          - "patch"
      ruff-policy:
        applies-to: version-updates
        patterns:
          - "ruff"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/dev_tracker/ui"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      npm-minor-patch:
        applies-to: version-updates
        exclude-patterns:
          - "playwright"
          - "@playwright/*"
          - "@vitest/browser-playwright"
          - "vitest-browser-react"
        update-types:
          - "minor"
          - "patch"
      browser-stack:
        applies-to: version-updates
        patterns:
          - "playwright"
          - "@playwright/*"
          - "@vitest/browser-playwright"
          - "vitest-browser-react"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      gha-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
