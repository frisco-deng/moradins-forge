  <text x="740" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">WinGet</text>
  <text x="740" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">official assets · uv</text>
  <text x="740" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#7c3aed">connected</text>

  <path d="M285 167 H310 M575 167 H600 M865 167 H900" stroke="#475569" stroke-width="4" fill="none"/>
  <path d="M893 159 L905 167 L893 175" fill="none" stroke="#475569" stroke-width="4"/>
  <rect x="905" y="92" width="260" height="150" rx="18" fill="#0f172a"/>
  <text x="1035" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">One V2 contract</text>
  <text x="1035" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#e2e8f0">doctor · frozen plan</text>
  <text x="1035" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#e2e8f0">checkpoints · receipt</text>
  <text x="1035" y="207" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#e2e8f0">verify · rollback</text>

  <rect x="150" y="292" width="900" height="60" rx="16" fill="#e2e8f0"/>
  <text x="600" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#0f172a">Agents plan and verify · Humans launch and approve elevation</text>
  <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#334155">No hidden elevation · no remote shell installer · protected host state remains bound</text>
