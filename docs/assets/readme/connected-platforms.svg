<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Qualitative Moradin Forge connected platform contract</title>
  <desc id="desc">Linux and WSL, macOS, and Windows feed equivalent verified providers into one digest-bound V2 plan, checkpoint, receipt, verification, and rollback contract. Complete air-gap kits remain Linux-only.</desc>
  <rect width="1200" height="390" rx="24" fill="#f8fafc"/>
  <rect x="24" y="22" width="145" height="38" rx="19" fill="#0f766e"/>
  <text x="96" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff">Qualitative</text>
  <text x="190" y="49" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Connected Platforms</text>

  <rect x="35" y="92" width="250" height="150" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="3"/>
  <text x="160" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Linux / WSL</text>
  <text x="160" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">apt · dnf · pacman</text>
  <text x="160" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">official assets · uv</text>
  <text x="160" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f766e">connected + air gap</text>

  <rect x="325" y="92" width="250" height="150" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="450" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">macOS</text>
  <text x="450" y="158" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">Homebrew</text>
  <text x="450" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">official assets · uv</text>
  <text x="450" y="218" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#2563eb">connected</text>

  <rect x="615" y="92" width="250" height="150" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
