[project]
name = "moradins-forge"
version = "0.2.0b3"
description = "Agent-first local integration kit for Moradin sidecars"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "pymarkdownlnt>=0.9.35",
]

[dependency-groups]
dev = [
    "hypothesis>=6.151.9",
    "pre-commit>=4.5.1",
    "pygments>=2.20.0",
    "pymarkdownlnt>=0.9.35",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "pytest-xdist[psutil]>=3.8.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "public_audit/release_evidence_excluded",
    "dev_tracker/ui/node_modules",
    "dev_tracker/ui/dist",
    ".git",
]

[tool.ruff.lint]
# Preserve the pre-0.16 default lint contract explicitly. Additional rules are
# reviewed as dedicated hardening changes instead of arriving through updates.
select = ["E4", "E7", "E9", "F"]
