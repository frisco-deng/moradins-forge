[project]
name = "moradins-forge"
version = "0.2.0b3"
description = "Agent-first local integration kit for Moradin sidecars"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "pymarkdownlnt>=0.9.39",
]

[dependency-groups]
dev = [
    "hypothesis>=6.165.0",
    "pre-commit>=4.6.1",
    "pygments>=2.20.0",
    "pymarkdownlnt>=0.9.39",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist[psutil]>=3.8.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    "public_audit/release_evidence_excluded",
    "dev_tracker/ui/node_modules",
    "dev_tracker/ui/dist",
    ".git",
]
